<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1><b></b><center>Student Registration Form</center></b></h1>
    <form>
        <h4></h4>
        <lable>Full name</lable><input type="text" name="name" placeholder="Enter full name" required><br><br>
        <lable>Email</lable><input type="email" name="email" placeholder="Enter Valid email id" required><br><br>
        <lable>Phone no</lable><input type="password" name="password" placeholder="Enter Password" required><br><br>
        <lable>Gender</lable><input type="radio" name="gender" value="male" required> Male
        <input type="radio" name="gender" value="female" required> Female
        <input type="radio" name="gender" value="other" required> Other<br><br>
        <lable>Course</lable><select name="room" required>
            <option value="c1">~Select course~</option>
            <option value="c2">BBA</option>
            <option value="c3">BTECH</option>
            <option value="c4">MBA</option>
            <option value="c5">MTech</option>
        </select><br><br>
        <lable>Contact no</lable><input type="tel" name="tel" placeholder="Enter phone number" required><br><br>
        <lable>ADDRESS </lable><textarea rows="4" cols="80" name="address" placeholder="Enter your address"></textarea><br><br>
        <button type="submit">Register</button>
        <button type="reset">Clear</button>
    </h4>
    </form>
<footer>
    <center><h3>&copy; Student Registration Portal</h3></center>
</body>
</html>
